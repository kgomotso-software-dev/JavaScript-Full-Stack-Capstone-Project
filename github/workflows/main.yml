name: CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:

  lint_backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend deps
        run: |
          cd giftlink-backend
          npm install
          npm install -g jshint

      - name: Run JSHint
        run: |
          cd giftlink-backend
          jshint .
          echo "Linted all the js files successfully"

  test_backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    needs: lint_backend

    env:
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend deps
        run: |
          cd giftlink-backend
          npm install

      - name: Run Mocha tests
        run: |
          cd giftlink-backend
          npm test

  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test_backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & Build Frontend
        run: |
          cd giftlink-frontend
          npm install
          npm run build
          echo "Client-side build successfully"